name: replication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"   # first of each month

permissions:
  contents: read

jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # the token is not left in .git/config

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Regenerate the exhibits
        run: ./run_all.sh

      - name: Verify the stored results are reproduced
        # Number-by-number comparison with a tight tolerance; see check_outputs.py.
        run: python3 check_outputs.py --no-run --also llms.txt
