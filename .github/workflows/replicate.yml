name: replication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"   # first of each month

jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Regenerate the exhibits
        run: ./run_all.sh

      - name: Verify the stored results are reproduced
        # Number-by-number comparison with a tight tolerance; see check_outputs.py.
        run: python3 check_outputs.py --no-run
